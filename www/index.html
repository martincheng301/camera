<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera Board Wi-Fi Setup</title>
  <style>
    :root {
      --bg: #f3efe7;
      --panel: #fffaf2;
      --ink: #20201c;
      --muted: #6a675f;
      --border: #d9cfbf;
    }
    body {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #fff7e6, var(--bg));
      color: var(--ink);
    }
    .wrap {
      max-width: 420px;
      margin: 48px auto;
      padding: 24px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 18px 40px rgba(32, 32, 28, 0.08);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }
    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.5;
    }
    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 600;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 16px;
      background: #fff;
    }
    button {
      margin-top: 18px;
      width: 100%;
      padding: 13px 16px;
      border: 0;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #0f766e, #155e75);
    }
    #result {
      margin-top: 16px;
      white-space: pre-wrap;
      color: #6a675f;
      min-height: 24px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Wi-Fi Setup</h1>
      <p>Connect the board to your router. Submit SSID and password below.</p>
      <form id="wifi-form">
        <label for="ssid">SSID</label>
        <input id="ssid" name="ssid" type="text" required>
        <label for="psk">Password</label>
        <input id="psk" name="psk" type="password" placeholder="Leave empty for open Wi-Fi">
        <button type="submit">Save Wi-Fi</button>
      </form>
      <div id="result"></div>
    </div>
  </div>
  <script>
    const form = document.getElementById('wifi-form');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      result.textContent = 'Saving...';

      const params = new URLSearchParams(new FormData(form));
      const response = await fetch(`/cgi-bin/save_wifi.cgi?${params.toString()}`);
      const text = await response.text();
      result.textContent = text;
    });
  </script>
</body>
</html>
